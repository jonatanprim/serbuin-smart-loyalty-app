<!DOCTYPE html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Serbuin - Smart Loyalty App with AI Insights & Rewards">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Serbuin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Serbuin - Smart Loyalty App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- ZXing Barcode & QR library UMD bundle directly loaded for instant, reliable scanning -->
  <script id="mobile-scanner-barcode-reader" src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <!-- iOS Safari and Chrome WebKit inline camera playback rules -->
  <script>
    (function() {
      function setupVideo(v) {
        if (!v) return;
        try {
          v.setAttribute('playsinline', '');
          v.setAttribute('webkit-playsinline', '');
          v.setAttribute('muted', '');
          v.setAttribute('autoplay', '');
          v.playsInline = true;
          v.webkitPlaysInline = true;
          v.muted = true;
          v.defaultMuted = true;
          v.autoplay = true;
        } catch (_) {}
      }

      // 1. Hook document.createElement to intercept video element creation
      try {
        var origCreate = document.createElement.bind(document);
        document.createElement = function(tagName, options) {
          var el = origCreate(tagName, options);
          if (tagName && String(tagName).toLowerCase() === 'video') {
            setupVideo(el);
          }
          return el;
        };
      } catch (_) {}

      // 2. Hook HTMLMediaElement.prototype.play
      try {
        if (window.HTMLMediaElement && HTMLMediaElement.prototype.play) {
          var origPlay = HTMLMediaElement.prototype.play;
          HTMLMediaElement.prototype.play = function() {
            setupVideo(this);
            return origPlay.apply(this, arguments);
          };
        }
      } catch (_) {}

      // 3. Hook srcObject setter
      try {
        var desc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'srcObject');
        if (desc && desc.set) {
          var origSet = desc.set;
          Object.defineProperty(HTMLMediaElement.prototype, 'srcObject', {
            get: desc.get,
            set: function(stream) {
              setupVideo(this);
              var res = origSet.call(this, stream);
              var self = this;
              if (stream) {
                setTimeout(function() {
                  setupVideo(self);
                  try {
                    var p = self.play();
                    if (p && p.catch) p.catch(function() {});
                  } catch (_) {}
                }, 50);
              }
              return res;
            },
            configurable: true,
            enumerable: true
          });
        }
      } catch (_) {}

      // 4. Polling loop to scan both standard DOM and all ShadowRoots (Flutter flt-glass-pane)
      function fixAllVideosInSubtree(root) {
        if (!root) return;
        try {
          if (root.querySelectorAll) {
            var vids = root.querySelectorAll('video');
            for (var i = 0; i < vids.length; i++) {
              setupVideo(vids[i]);
              if (vids[i].paused && vids[i].srcObject) {
                try { vids[i].play(); } catch (_) {}
              }
            }
            var allNodes = root.querySelectorAll('*');
            for (var j = 0; j < allNodes.length; j++) {
              if (allNodes[j].shadowRoot) {
                fixAllVideosInSubtree(allNodes[j].shadowRoot);
              }
            }
          }
        } catch (_) {}
      }

      setInterval(function() {
        fixAllVideosInSubtree(document);
      }, 500);
    })();
  </script>
</head>
<body>
  <!--

</body>
