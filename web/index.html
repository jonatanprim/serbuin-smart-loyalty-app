<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Serbuin - Smart Loyalty App with AI Insights & Rewards">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Serbuin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Serbuin - Smart Loyalty App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- ZXing Barcode & QR library UMD bundle directly loaded for instant, reliable scanning -->
  <script id="mobile-scanner-barcode-reader" src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <!-- iOS Safari and Chrome WebKit inline camera playback rules -->
  <style>
    video {
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }
  </style>
  <script>
    (function() {
      function makeVideoInline(v) {
        if (!v || v.__inline_ready) return;
        v.__inline_ready = true;
        try {
          v.setAttribute('playsinline', '');
          v.setAttribute('webkit-playsinline', '');
          v.playsInline = true;
          v.muted = true;
          v.setAttribute('muted', '');
        } catch (_) {}
      }

      if (window.MutationObserver) {
        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              var n = added[j];
              if (n.nodeType === 1) {
                if (n.tagName === 'VIDEO') {
                  makeVideoInline(n);
                } else if (n.getElementsByTagName) {
                  var vids = n.getElementsByTagName('video');
                  for (var k = 0; k < vids.length; k++) {
                    makeVideoInline(vids[k]);
                  }
                }
              }
            }
          }
        });
        if (document.documentElement) {
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
